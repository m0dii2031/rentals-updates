<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>استراحاتي</title>
<style>
/* خط IBM Plex Sans Arabic (رخصة OFL) مضمّن مع التطبيق ليعمل بدون إنترنت */
@font-face{font-family:Plex;font-weight:400;font-display:swap;src:url(fonts/plex-ar-400.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:Plex;font-weight:600;font-display:swap;src:url(fonts/plex-ar-600.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:Plex;font-weight:700;font-display:swap;src:url(fonts/plex-ar-700.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:Plex;font-weight:400;font-display:swap;src:url(fonts/plex-la-400.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2212}
@font-face{font-family:Plex;font-weight:600;font-display:swap;src:url(fonts/plex-la-600.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2212}
@font-face{font-family:Plex;font-weight:700;font-display:swap;src:url(fonts/plex-la-700.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2212}

/* التصميم: سطح داكن عميق بتوهج أزرق-بنفسجي، بطاقات زجاجية، حركة ناعمة */
:root{
  --bg:#F3F5FA; --bg-glow1:rgba(79,124,255,.10); --bg-glow2:rgba(139,92,246,.08);
  --card:#FFFFFF; --card2:#F6F8FC; --line:rgba(15,23,42,.07); --line2:rgba(15,23,42,.12);
  --tx:#0E1424; --tx2:#3A445A; --mut:#6B7489; --mut2:#9AA2B4;
  --pri:#3D6BFF; --pri-2:#7A5CFF; --pri-soft:rgba(61,107,255,.10); --on-pri:#fff;
  --ok:#0EA968; --ok-soft:rgba(14,169,104,.12);
  --wait:#D98A00; --wait-soft:rgba(245,166,35,.16);
  --no:#E5484D; --no-soft:rgba(229,72,77,.11);
  --part:#3D6BFF; --part-soft:rgba(61,107,255,.11);
  --wa:#17B861; --tn:#0E9F8E; --amber:#F5B301;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px -12px rgba(16,24,40,.12);
  --shadow-lg:0 20px 50px -20px rgba(30,41,80,.35);
  --glass:rgba(255,255,255,.72); --nav:rgba(255,255,255,.82);
  --hero:linear-gradient(135deg,#3D6BFF 0%,#6B5CFF 55%,#9B5CFF 100%);
  --field:#FFFFFF; --field-dis:#EEF1F6;
  --r:20px; --r-sm:14px;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#070B16; --bg-glow1:rgba(61,107,255,.20); --bg-glow2:rgba(155,92,255,.14);
  --card:#0F1526; --card2:#141B2F; --line:rgba(255,255,255,.06); --line2:rgba(255,255,255,.11);
  --tx:#EEF1F8; --tx2:#C3CAD9; --mut:#8B94AA; --mut2:#5E6780;
  --pri:#6E8EFF; --pri-2:#A07CFF; --pri-soft:rgba(110,142,255,.14); --on-pri:#fff;
  --ok:#34D399; --ok-soft:rgba(52,211,153,.13);
  --wait:#FBBF24; --wait-soft:rgba(251,191,36,.13);
  --no:#FB7185; --no-soft:rgba(251,113,133,.13);
  --part:#7DA2FF; --part-soft:rgba(110,142,255,.15);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -14px rgba(0,0,0,.6);
  --shadow-lg:0 30px 60px -20px rgba(0,0,0,.7);
  --glass:rgba(10,14,28,.66); --nav:rgba(15,21,38,.78);
  --hero:linear-gradient(135deg,#2B4FE0 0%,#5A3FE0 55%,#8B3FD9 100%);
  --field:#0B1121; --field-dis:#121A2C;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;color:var(--tx);font-family:Plex,system-ui,"Segoe UI",Tahoma,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(900px 500px at 110% -10%,var(--bg-glow1),transparent 60%),radial-gradient(700px 500px at -20% 10%,var(--bg-glow2),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh;transition:background-color .3s}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;transition:transform .18s var(--ease),background-color .2s,opacity .2s}
button:active{transform:scale(.96)}
input,select,textarea{font:inherit;width:100%;min-width:0;max-width:100%;padding:12px 14px;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--field);color:var(--tx);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-soft)}
input:disabled,select:disabled{background:var(--field-dis);color:var(--mut)}
textarea{min-height:76px;resize:vertical}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}

/* الشريط العلوي */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:14px 16px 12px;background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--line)}
.top h1{flex:1;margin:0;font-size:20px;font-weight:700;letter-spacing:-.2px;text-wrap:balance}
.top .hi{flex:1;min-width:0}
.top .hi small{display:block;color:var(--mut);font-size:12.5px;font-weight:600}
.top .hi h1{font-size:24px;line-height:1.2}
.ib{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none}
.ib:active{background:var(--pri-soft)}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* عدّاد موعد الإيجار: حلقة تتعبّى كل ما قرب اليوم */
.due{position:relative;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.due .ring{width:46px;height:46px;flex:none;position:relative}
.due .ring svg{width:46px;height:46px;transform:rotate(-90deg)}
.due .ring circle{fill:none;stroke-width:5}
.due .ring .trk{stroke:var(--line2)}
.due .ring .val{stroke:url(#dueG);stroke-linecap:round;transition:stroke-dashoffset 1.2s var(--ease)}
.due .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.due .tx{line-height:1.15;text-align:right}
.due .tx b{display:block;font-size:14px}
.due .tx span{font-size:11.5px;color:var(--mut)}
.due.soon{background:linear-gradient(135deg,#FFC93C,#FF9F1C);border-color:transparent;color:#2B1A00}
.due.soon .tx span{color:rgba(43,26,0,.7)}.due.soon .ring .trk{stroke:rgba(43,26,0,.15)}
.due.soon .ring .val{stroke:#2B1A00}

.wrap{padding:14px 14px 170px}

/* بطاقة الشهر الرئيسية */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:16px 16px 18px;margin-bottom:14px;color:#fff;background:var(--hero);box-shadow:0 24px 50px -24px rgba(61,90,255,.65)}
.hero:before{content:"";position:absolute;inset:-40% -30% auto auto;width:280px;height:280px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.28),transparent);animation:float 9s ease-in-out infinite}
.hero:after{content:"";position:absolute;inset:auto auto -45% -25%;width:260px;height:260px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,220,255,.22),transparent);animation:float 11s ease-in-out infinite reverse}
.hero>*{position:relative;z-index:1}
.hm{display:flex;align-items:center;justify-content:space-between;gap:6px}
.hm .ib{color:#fff;background:rgba(255,255,255,.14);width:38px;height:38px;border-radius:12px}
.hm .t{text-align:center;min-width:0}
.hm .t b{display:block;font-size:17px;font-weight:700}
.hm .t small{display:block;font-size:12px;opacity:.78}
.hm .t a{color:#fff;text-decoration:underline;text-underline-offset:3px;opacity:.95}
.hbig{margin:16px 2px 4px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.hbig .lbl{font-size:13px;opacity:.82;font-weight:600}
.hbig .num{font-size:38px;font-weight:700;letter-spacing:-1px;line-height:1.05;font-variant-numeric:tabular-nums}
.hbig .num small{font-size:15px;opacity:.75;font-weight:600;letter-spacing:0;margin-inline-start:4px}
.hbig .pct{font-size:13px;font-weight:700;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.18);white-space:nowrap}
.hbar{height:10px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden;display:flex;margin:12px 0 14px}
.hbar i{display:block;height:100%;transform-origin:right;animation:grow 1s var(--ease) both}
.hbar .g{background:linear-gradient(90deg,#5CF2B0,#25D695)}
.hbar .w{background:linear-gradient(90deg,#FFE07A,#FFC23C)}
.hstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hstats div{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:8px 10px}
.hstats span{display:flex;align-items:center;gap:6px;font-size:11.5px;opacity:.85;font-weight:600}
.hstats span:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--d)}
.hstats b{display:block;font-size:17px;font-variant-numeric:tabular-nums;margin-top:2px}

/* الفلاتر */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:4px;margin-bottom:10px}
.chip{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--tx2);box-shadow:var(--shadow)}
.chip.on{background:var(--tx);border-color:var(--tx);color:var(--bg)}
.seg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:4px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:14px;box-shadow:var(--shadow)}
.seg button{padding:9px 2px;border-radius:12px;font-size:13px;font-weight:600;color:var(--mut);white-space:nowrap}
.seg button.on{background:var(--pri-soft);color:var(--pri)}
.seg button i{font-style:normal;font-size:11px;opacity:.8;margin-inline-start:3px}

/* الأراضي والاستراحات */
.land{position:relative;background:var(--card);border-radius:var(--r);margin-bottom:14px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
.land:before{content:"";position:absolute;inset:0 0 auto 0;height:84px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 16%,transparent),transparent);pointer-events:none}
.lh{position:relative;display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
.lh .dot{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent),0 0 16px var(--c);flex:none}
.lh h2{margin:0;font-size:17px;font-weight:700;line-height:1.25}
.lh .meta{font-size:12.5px;color:var(--mut);margin-top:2px}
.lh .ib{width:38px;height:38px;color:var(--tx2);border-radius:12px;background:var(--card2)}
.lh .ib svg{width:18px;height:18px}
.lprog{position:relative;height:4px;margin:0 14px 6px;border-radius:999px;background:var(--line);overflow:hidden}
.lprog i{display:block;height:100%;background:var(--c);border-radius:999px;transform-origin:right;animation:grow .9s var(--ease) both}
.u{position:relative;display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.u:active{background:var(--card2)}
.u .nm{flex:1;min-width:0}
.u .no{flex:none;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.u .nm b{display:block;font-size:15.5px;font-weight:600;line-height:1.35}
.u .nm small{display:block;color:var(--mut);font-size:12px}
.u .nm small.mtr{color:var(--mut2);font-size:12px;letter-spacing:.4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.u .amt{font-weight:700;font-size:15px;min-width:48px;text-align:left;font-variant-numeric:tabular-nums}
.u .bolt{width:34px;height:34px;color:var(--amber);flex:none;border-radius:10px}.u .bolt svg{width:19px;height:19px}.u .bolt.off{color:var(--mut2);opacity:.6}
.st{min-width:82px;padding:7px 10px;border-radius:999px;font-size:12.5px;font-weight:700;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.st:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.st.paid{background:var(--ok-soft);color:var(--ok)}
.st.platform{background:var(--wait-soft);color:var(--wait)}
.st.unpaid{background:var(--no-soft);color:var(--no)}
.st.partial{background:var(--part-soft);color:var(--part)}
.lh .tag{display:inline-block;vertical-align:middle;margin-inline-start:8px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 28%,transparent);font-variant-numeric:tabular-nums}
.addrow{width:100%;padding:16px;border-radius:var(--r);border:2px dashed var(--line2);color:var(--mut);font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.addrow span{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--hero);color:#fff;font-size:20px}
.empty{text-align:center;color:var(--mut);padding:44px 10px}

/* زر الإضافة العائم */
.fab{position:fixed;left:18px;bottom:calc(96px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:20px;background:var(--hero);color:#fff;font-size:30px;font-weight:400;box-shadow:0 16px 30px -10px rgba(80,80,255,.7);z-index:6;animation:pop .5s var(--spring) .2s both}

/* البطاقات العامة */
.card{background:var(--card);border-radius:var(--r);padding:4px 0;margin-bottom:14px;border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.card h3{margin:14px 16px 6px;font-size:13px;color:var(--mut);font-weight:700;letter-spacing:.2px}
.row{display:flex;align-items:center;gap:6px;padding:11px 16px;border-top:1px solid var(--line)}
.card h3+.row,.card .row:first-child{border-top:0}
.row .k{font-size:12px;color:var(--mut);font-weight:600}
.row .v{font-size:16px;word-break:break-word;direction:auto;font-variant-numeric:tabular-nums}
.row .f{flex:1;min-width:0}
.row .ib{width:38px;height:38px;color:var(--pri);border-radius:12px}
.row .ib:active{background:var(--pri-soft)}
.row .ib svg{width:19px;height:19px}

/* صفحة الاستراحة */
.uhero{position:relative;overflow:hidden;border-radius:26px;padding:18px;margin-bottom:14px;color:#fff;background:linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 45%,#1a1f4a));box-shadow:0 24px 50px -26px var(--c)}
.uhero:before{content:"";position:absolute;inset:-50% -30% auto auto;width:260px;height:260px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.3),transparent);animation:float 10s ease-in-out infinite}
.uhero>*{position:relative}
.uhero .l1{display:flex;align-items:center;gap:12px}
.uhero .bn{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:26px;font-weight:700;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);flex:none}
.uhero .nm{flex:1;min-width:0}
.uhero .nm small{display:block;font-size:12.5px;opacity:.85;font-weight:600}
.uhero .nm b{display:block;font-size:22px;line-height:1.25}
.uhero .l2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.2)}
.uhero .l2 .r{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.uhero .l2 .r small{font-size:13px;opacity:.8;font-weight:600;margin-inline-start:4px}
.uhero .l2 .m{font-size:12px;opacity:.85}
.uhero .st{background:rgba(255,255,255,.95)}
.uhero .mtrl{margin-top:8px;font-size:13px;opacity:.9;letter-spacing:.4px;font-variant-numeric:tabular-nums}

/* الأزرار */
.btns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-bottom:14px}
.btn{padding:13px 12px;border-radius:16px;background:var(--pri);color:var(--on-pri);font-weight:700;text-align:center;display:flex;align-items:center;justify-content:center;gap:7px;box-shadow:0 10px 22px -12px var(--pri)}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--line2);box-shadow:var(--shadow)}
.btn.wa{background:var(--wa);box-shadow:0 10px 22px -12px var(--wa)}
.btn.tn{background:var(--tn);color:#fff;box-shadow:0 10px 22px -12px var(--tn)}
.btn.elec{background:linear-gradient(135deg,#FFD54A,#FFAA1C);color:#2B1A00;box-shadow:0 10px 22px -12px #FFAA1C}
.btn.red{background:var(--no-soft);color:var(--no);border:0;box-shadow:none}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn.full{grid-column:1/-1}

/* الحقول */
.fld{padding:8px 16px}
.fld label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px;font-weight:600}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 8px}
.colors{display:flex;flex-wrap:wrap;gap:10px}
.colors button{width:38px;height:38px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line2)}
.colors button.on{box-shadow:0 0 0 3px var(--tx)}
.hist .row{font-size:14px}

/* المستندات */
.docs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:8px 16px 14px}
.doc{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--pri-soft);display:grid;place-items:center;color:var(--pri);font-weight:700}
.doc img{width:100%;height:100%;object-fit:cover;display:block}
.doc span{position:absolute;inset:auto 0 0 0;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);color:#fff;font-size:11px;padding:14px 6px 5px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc.add{background:transparent;border:2px dashed var(--line2);font-size:28px;font-weight:400}
.viewer img{width:100%;border-radius:18px;display:block;margin-bottom:12px;background:#000}
.ago{font-size:12px;color:var(--pri-2);font-weight:700}.ago.big{font-size:13px;background:color-mix(in srgb,var(--pri-2) 14%,transparent);padding:6px 11px;border-radius:999px;white-space:nowrap}
.mc{display:inline-block;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--wait-soft);color:var(--wait);white-space:nowrap}

/* النوافذ السفلية */
.ov{position:fixed;inset:0;background:rgba(3,6,15,.5);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:30;display:flex;align-items:flex-end;animation:fd .2s}
.sheet{background:var(--bg);width:100%;max-height:88vh;overflow:auto;border-radius:28px 28px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .42s var(--spring);border-top:1px solid var(--line2);box-shadow:var(--shadow-lg)}
.sx{position:sticky;top:0;float:left;z-index:3;width:38px;height:38px;border-radius:50%;background:var(--card2);border:1px solid var(--line);color:var(--tx);font-size:16px;font-weight:700;margin:4px 0 0}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line2);margin:6px auto 12px}
.sheet h2{margin:4px 0 14px;font-size:19px;font-weight:700;text-wrap:balance}
.sheet .card{margin-bottom:10px}
.sbig{display:grid;gap:8px;margin-bottom:12px}
.sbig button{padding:16px;border-radius:18px;font-weight:700;font-size:16px;text-align:right;display:flex;align-items:center;gap:10px;border:2px solid transparent}
.sbig .paid{background:var(--ok-soft);color:var(--ok)}

const HM=['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];

function nowPeriod(cal){
  const d=new Date();
  if(cal==='H'){
    try{
      const p=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{year:'numeric',month:'numeric'}).formatToParts(d);
      const y=parseInt(p.find(x=>x.type==='year').value),m=parseInt(p.find(x=>x.type==='month').value);
      if(y>1300&&m>=1&&m<=12) return {y,m};
    }catch(e){}
    // تقريب احتياطي
    const jd=Math.floor(d.getTime()/864e5)+2440588-1948440+10632, n=Math.floor((jd-1)/10631), r=jd-10631*n+354;
    const j=Math.floor((10985-r)/5316)*Math.floor(50*r/17719)+Math.floor(r/5670)*Math.floor(43*r/15238);

    return {y:30*n+j-30,m:Math.floor(24*rr/709)};

  return {y:d.getFullYear(),m:d.getMonth()+1};
}

function hStart(p){let d=new Date(Date.UTC(622,6,16)+((p.y-1)*354.367+(p.m-1)*29.5306)*864e5);d=new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),12);

function dueInfo(){const day=+db.settings.dueDay||27,[Y,M,D]=today().split('-').map(Number),t=new Date(Y,M-1,D),dim=(y,m)=>new Date(y,m+1,0).getDate();
  let d=new Date(t.getFullYear(),t.getMonth(),Math.min(day,dim(t.getFullYear(),t.getMonth())));
  if(d<t)d=new Date(t.getFullYear(),t.getMonth()+1,Math.min(day,dim(t.getFullYear(),t.getMonth()+1)));
  return {days:Math.round((d-t)/864e5),date:d}}
function dueBadge(){const {days,date}=dueInfo(),cyc=new Date(date.getFullYear(),date.getMonth(),0).getDate()||30,frac=Math.max(.04,1-days/cyc),C=2*Math.PI*19;
  const big=days===0?'اليوم':days===1?'بكرة':days===2?'يومين':days+' '+(days<=10?'أيام':'يوم'),small=days<=1?'موعد الإيجار':'باقي على الإيجار';
  return `<div class="due ${days<=3?'soon':''}" onclick="toast('موعد الإيجار: ${date.getDate()} ${GM[date.getMonth()]}')"><div class="tx"><b>${big}</b><span>${small}</span></div><div class="ring"><svg viewBox="0 0 46 46"><defs><linearGradient id="dueG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6E8EFF"/><stop offset="1" stop-color="#B07CFF"/></linearGradient></defs><circle class="trk" cx="23" cy="23" r="19"/><circle class="val" cx="23" cy="23" r="19" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-frac)).toFixed(1)}"/></svg><b>${days===0?'✓':days}</b></div></div>`}
function greet(){const h=new Date().getHours(),n=((db.me&&db.me.fullName)||'').split(' ')[0];return (h<12?'صباح الخير':'مساء الخير')+(n?' يا '+n:'')+' 👋'}

  const mo=Math.floor(d/30.44);if(mo<12)return 'مضى '+n(mo,'شهر','شهرين','أشهر','شهر');
  const y=Math.floor(mo/12),r=mo%12;return 'مضى '+n(y,'سنة','سنتين','سنوات','سنة')+(r?' و'+n(r,'شهر','شهرين','أشهر','شهر'):'')}

function yearData(y){
  const cal=db.settings.cal,now=nowPeriod(cal),el=y<now.y?12:y>now.y?0:now.m;
  const ks=[...Array(12)].map((_,i)=>pkey(cal,{y,m:i+1})),inY=d=>d&&(cal==='G'?d.slice(0,4)===String(y):(()=>{const h=hParts(new Date(d+'T12:00'));return h&&h.y===y})());
  const mon=ks.map(k=>db.units.reduce((t,u)=>{const x=payOf(u,k);return t+(x&&(x.s==='paid'||x.s==='partial')?netA(u,x):0)},0));
  const lands=db.lands.map(l=>{const us=unitsOf(l.id).map(u=>{let got=0,pm=0,pend=0;ks.forEach(k=>{const x=payOf(u,k);if(x&&(x.s==='paid'||x.s==='partial')){got+=netA(u,x);if(x.s==='paid')pm++}if(x&&x.s==='platform')pend+=netA(u,x)});
      const mt=(u.maint||[]).filter(m=>inY(m.date)).reduce((t,m)=>t+(+m.amount||0),0);return {u,got,pm,pend,mt,exp:(nr(u)?0:+u.rent||0)*el}});
    const sum=f=>us.reduce((t,x)=>t+x[f],0),fee=+l.fee||0,fp=(l.feePaid||{})[y];return {l,us,got:sum('got'),mt:sum('mt'),exp:sum('exp'),pend:sum('pend'),fee,fp}});
  const sum=f=>lands.reduce((t,x)=>t+x[f],0);
  return {y,cal,el,mon,lands,got:sum('got'),mt:sum('mt'),exp:sum('exp'),pend:sum('pend'),fee:sum('fee')};
}

function stampWater(d,l){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{try{
  const k=Math.min(1,1280/Math.max(im.width,im.height)),W=Math.round(im.width*k),IH=Math.round(im.height*k),BH=Math.round(Math.max(W*.3,IH*.22)),c=document.createElement('canvas');

  const noWater=(cx,cy,r)=>{x.save();x.fillStyle='#fff';x.beginPath();x.arc(cx,cy,r,0,7);x.fill();x.textAlign='center';x.textBaseline='middle';E(Math.round(r*1.15));x.fillText('💧',cx,cy+r*.06);
    x.strokeStyle='#E5262B';x.lineWidth=r*.17;x.beginPath();x.arc(cx,cy,r*.86,0,7);x.stroke();x.beginPath();x.moveTo(cx-r*.6,cy-r*.6);x.lineTo(cx+r*.6,cy+r*.6);x.stroke();x.restore()};

  x.beginPath();x.moveTo(ax1,cy);x.lineTo(ax1+BH*.12,cy-BH*.1);x.moveTo(ax1,cy);x.lineTo(ax1+BH*.12,cy+BH*.1);x.stroke();
  x.textAlign='center';x.textBaseline='middle';E(Math.round(r*1.5));x.fillText('🚛',W*.73,cy);E(Math.round(r*.8));x.fillText('💧',W*.73+r*1.05,cy-r*.75);
  const [Y,M,D]=today().split('-');x.font='700 '+Math.round(BH*.13)+'px Plex,system-ui,sans-serif';x.fillStyle='rgba(255,255,255,.92)';x.fillText('📍 '+(l.landNo||'')+'   ·   '+D+'/'+M+'/'+Y,W/2,IH+BH*.86);
  res(c.toDataURL('image/jpeg',.86))}catch(e){rej(e)}};im.onerror=rej;im.src=docSrc(d)})}

/* ---------- رسوم البلدية (فرص): حالة كل سنة، المتأخر، والقادم ---------- */
const isoD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function feeDate(l,y){if(!l.feeDue)return null;return new Date(y,+l.feeDue.slice(5,7)-1,+l.feeDue.slice(8,10))}
function feeStatus(l){const [Y,M,D]=today().split('-').map(Number),t=new Date(Y,M-1,D),paid=l.feePaid||{};if(!l.fee||!l.feeDue)return null;

  let y=Math.max(Y,+l.feeDue.slice(0,4));while(paid[y]||feeDate(l,y)<t)y++;const d=feeDate(l,y);return {y,d,n:Math.round((d-t)/864e5),late:false}}
const dayWord=n=>n===1?'يوم':n===2?'يومين':n<=10?n+' أيام':n+' يوم';

/* ---------- رسائل منصة إيجار: قراءة "نفيدك بسداد المستأجر ... مبلغ ... للعقد رقم ..." وتسجيلها ---------- */
const toLatin=t=>String(t||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/٫/g,'.').replace(/٬/g,',');
function parseEjar(text){const t=toLatin(text).replace(/[ً-ْـ]/g,'').replace(/\s+/g,' '),out=[];
  // كل رسالة تبدأ بـ "بسداد المستأجر"؛ نقسم النص عليها عشان ما تختلط معلومات رسالتين
  // نتسامح مع أخطاء قراءة الصور: كلمة "مبلغ" ممكن تنقرأ غلط، فنعتمد على المبلغ نفسه (رقم بفاصلة عشرية)
  t.split(/بسداد ال?مستأجر/).slice(1).forEach(ch=>{const am=/(\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|\d+\.\d{1,2}|\d+)\s*ريال/.exec(ch)||/(\d{1,3}(?:,\d{3})*\.\d{2})/.exec(ch);if(!am)return;
    let name=ch.slice(0,am.index).replace(/\s*بقيمة\s*$/,'').trim().split(' ');if(name.length>1&&/^مب/.test(name[name.length-1]))name.pop();name=name.slice(0,6).join(' ');
    const rest=ch.slice(am.index),ct=/للعقد\s*رقم\s*(\d+)/.exec(rest),ac=/المنتهي\s*ب\S*\s*(\d{3,4})/.exec(rest);
    // رقم العقد أحياناً ما ينقرأ من الصورة (عليه خط) — نتجاهله إذا قصير
    if(name)out.push({name,amount:+am[1].replace(/,/g,''),contract:ct&&ct[1].length>=8?ct[1]:'',acct:ac?ac[1]:''})});

   <div class="btns" style="padding:0 14px"><button class="btn full" onclick="db.settings.myAcct=document.getElementById('f_myacct').value.trim();db.settings.officeAcct=document.getElementById('f_offacct').value.trim();save();toast('تم الحفظ')">حفظ</button></div></div>
  <div class="card"><h3>المكتب العقاري</h3>${fld('oname','اسم المكتب',db.settings.officeName)}${fld('ophone','رقم واتساب المكتب',db.settings.office,'tel','placeholder="05xxxxxxxx"')}
   <div class="btns" style="padding:0 14px"><button class="btn full" onclick="db.settings.officeName=document.getElementById('f_oname').value.trim();db.settings.office=document.getElementById('f_ophone').value.trim();save();toast('تم حفظ رقم المكتب')">حفظ</button></div></div>
  <div class="card"><h3>موعد الإيجار الشهري</h3><div class="fld"><label>يوم الاستحقاق من كل شهر ميلادي (يظهر العدّاد فوق في الرئيسية)</label><input id="f_due" type="number" min="1" max="31" inputmode="numeric" value="${db.settings.dueDay||27}" onchange="const v=Math.min(31,Math.max(1,parseInt(this.value)||27));db.settings.dueDay=v;this.value=v;save();toast('تم الحفظ')"></div></div>
  <div class="card"><h3>التقويم المستخدم للأشهر</h3><div class="fld"><div class="chips"><button class="chip ${c==='H'?'on':''}" onclick="setCal('H')">هجري</button><button class="chip ${c==='G'?'on':''}" onclick="setCal('G')">ميلادي</button></div></div></div>
  <div class="card"><h3>النسخ الاحتياطي</h3><div class="fld" style="font-size:14px;color:var(--mut)">احفظ نسخة من بياناتك وصور المستندات بشكل دوري (على قوقل درايف) حتى لا تضيع لو تغيّر الجوال.<br><b style="color:var(--tx)">${db.settings.lastBackup?'آخر نسخة: '+db.settings.lastBackup+' ('+ago(db.settings.lastBackup)+')':'ما سويت نسخة للحين'}</b></div>
   <div class="btns" style="padding:0 14px"><button class="btn" onclick="exportBk()">حفظ نسخة</button><button class="btn sec" onclick="importBk()">استرجاع نسخة</button></div></div>
  <div class="card"><h3>حجم الخط</h3><div class="fld"><div class="chips">${[[1,'عادي'],[1.12,'كبير'],[1.25,'كبير جداً']].map(([z,t])=>`<button class="chip ${(db.settings.zoom||1)==z?'on':''}" onclick="db.settings.zoom=${z};save();applyZoom();render()">${t}</button>`).join('')}</div></div></div>
  <div class="card"><h3>رسالة تذكير المستأجر (واتساب)</h3><div class="fld"><textarea id="f_tpl" style="min-height:120px">${esc(db.settings.remindTpl||DEF_TPL)}</textarea><div style="font-size:12px;color:var(--mut);margin-top:6px">تقدر تستخدم: {المستأجر} {الاستراحة} {الشهر} {المبلغ}</div></div>
   <div class="btns" style="padding:0 14px"><button class="btn" onclick="db.settings.remindTpl=document.getElementById('f_tpl').value;save();toast('تم الحفظ')">حفظ الرسالة</button><button class="btn sec" onclick="delete db.settings.remindTpl;save();render();toast('رجعت الرسالة الأصلية')">الرسالة الأصلية</button></div></div>
  <div class="card"><h3>معلومات</h3><div class="fld" style="font-size:14px;color:var(--mut)">${db.lands.length} أراضي · ${db.units.length} استراحات<br>البيانات محفوظة على جوالك فقط.</div></div>
  <div class="btns"><button class="btn red full" onclick="resetAll()">مسح كل البيانات</button></div></div>`;
}
function setCal(c){if(c===db.settings.cal)return;if(!confirm('سجل الدفعات مرتبط بالتقويم. التبديل يُظهر أشهر التقويم الآخر (الدفعات القديمة تبقى محفوظة). متابعة؟'))return;db.settings.cal=c;ui.period=null;save();render()}
window.onBackupDone=function(){db.settings.lastBackup=today();save();render()};
function exportBk(){const s=JSON.stringify(db,null,1),n='rentals-backup-'+today()+'.json';if(A)A.exportFile(n,s);else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'application/json'}));a.download=n;a.click();onBackupDone()}}
function importBk(){if(A)A.importFile();else{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const r=new FileReader();r.onload=()=>onImport(r.result);r.readAsText(i.files[0])};i.click()}}
// حزمة مستندات (مثل عقود البلدية) تنضاف للاستراحات حسب رقم القطعة ورقم الاستراحة بدون ما تمسح شي
function importPack(d){let n=0;const miss=[];
  d.items.forEach(it=>{const l=db.lands.find(x=>String(x.landNo)===String(it.plot)),u=it.unit==null?l:l&&unitsOf(l.id).find(x=>String(uNo(x))===String(it.unit));
    if(!u){miss.push(it.plot+(it.unit!=null?'/'+it.unit:''));return}u.docs=u.docs||[];if(u.docs.some(x=>x.file===it.file))return;
    u.docs.push({id:uid(),kind:it.kind||CK,name:it.name||'',file:it.file,pdf:/\.pdf$/i.test(it.file),date:today()});n++});
  save();_lastView='';render();alert('تمت إضافة '+n+' ملف'+(miss.length?'\nما لقيت: '+miss.join('، '):''))}
// عقود منصة إيجار (رقم العقد، المستأجر، البداية والنهاية): نقترح الاستراحة لكل عقد وتأكدها قبل الحفظ
function ejarContractsSheet(items){
  const toks=n=>normAr(n).split(/\s+/).map(normAr).filter(w=>w.length>2&&!['بن','ابن','ابو'].includes(w));
  const freq={};items.forEach(it=>new Set(toks(it.tenant)).forEach(w=>freq[w]=(freq[w]||0)+1));
  const cand=[];items.forEach((it,i)=>{const c=String(it.c);db.units.forEach(u=>{let sc=0;
      if(u.contractNo&&toLatin(u.contractNo).replace(/\D/g,'')===c)sc=100;
      else{const hay=new Set([...toks(u.name||''),...toks(u.tenant||'')]);toks(it.tenant).forEach(w=>{if(hay.has(w))sc+=freq[w]>1?.3:1})}
      if(sc>=1)cand.push({i,u,sc})})});
  cand.sort((a,b)=>b.sc-a.sc);const pick={},used=new Set();cand.forEach(x=>{if(pick[x.i]==null&&!used.has(x.u.id)){pick[x.i]=x.u.id;used.add(x.u.id)}});
  window._ec=items;
  const opts=sel=>`<option value="">— اختر الاستراحة (أو تجاهل) —</option>`+db.lands.map(l=>`<optgroup label="${esc(l.name)}">${unitsOf(l.id).map(u=>`<option value="${u.id}" ${sel===u.id?'selected':''}>${esc(uNo(u)+' - '+(u.name||'فاضية'))}</option>`).join('')}</optgroup>`).join('');
  sheet(`<h2>📑 عقود إيجار (${items.length})</h2><div style="color:var(--mut);font-size:13.5px;margin-bottom:10px">اخترت لك الاستراحة لكل عقد حسب الاسم. تأكد منها، وعدّل اللي غلط، واللي ما عرفته اختره أنت.</div>
   ${items.map((it,i)=>`<div class="card" style="padding:12px 14px"><b style="font-size:15px">${esc(it.tenant)}</b><div style="font-size:12.5px;color:var(--mut);margin:4px 0 8px">عقد ${esc(it.c)} · ${fdate(it.start)} ← ${fdate(it.end)}${pick[i]?' · <span style="color:var(--ok)">✓ اقتراح</span>':' · <span style="color:var(--no)">اختر الاستراحة</span>'}</div><select id="ec_${i}">${opts(pick[i])}</select></div>`).join('')}
   <div class="btns" style="margin-top:6px"><button class="btn full" onclick="ejarContractsSave()">${I.check} حفظ العقود</button></div>`)}
function ejarContractsSave(){let n=0;const seen=new Set();
  for(let i=0;i<window._ec.length;i++){const id=document.getElementById('ec_'+i).value;if(!id)continue;if(seen.has(id)){toast('فيه استراحة مختارة لعقدين — عدّلها');return}seen.add(id)}
  window._ec.forEach((it,i)=>{const id=document.getElementById('ec_'+i).value;if(!id)return;const u=unit(id);
    u.contractNo=String(it.c);u.tenant=it.tenant;u.start=it.start;u.end=it.end;if(u.vacant){u.vacant=false;delete u.vacantSince}if(!u.name){const w=it.tenant.split(/\s+/).filter(x=>x!=='بن');u.name=w.length>1?w[0]+' '+w[w.length-1]:it.tenant}n++});
  save();closeSheet();_lastView='';render();toast('تم حفظ '+n+' عقد')}
window.onImport=function(s){
  try{const d=JSON.parse(s);if(d.kind==='ejar-contracts'&&Array.isArray(d.items))return ejarContractsSheet(d.items);if(d.kind==='docs-pack'&&Array.isArray(d.items))return importPack(d);if(!d.lands||!d.units)throw 0;if(!confirm('سيتم استبدال بياناتك الحالية بالنسخة ('+d.units.length+' استراحة). متابعة؟'))return;db=d;db.pay=db.pay||{};db.settings=db.settings||{cal:'H'};save();stack=[{v:'home'}];ui.period=null;render();toast('تم الاسترجاع')}
  catch(e){alert('الملف غير صالح')}
};
function resetAll(){if(!confirm('سيتم مسح كل شيء نهائياً. هل أنت متأكد؟'))return;if(!confirm('تأكيد أخير: مسح كل البيانات؟'))return;db={v:1,settings:{cal:db.settings.cal},lands:[],units:[],pay:{}};save();stack=[{v:'home'}];render()}

function countUp(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;document.querySelectorAll('[data-count]').forEach(e=>{const to=+e.dataset.count,t0=performance.now(),D=900;if(!to)return;
  const f=t=>{const k=Math.min(1,(t-t0)/D),v=to*(1-Math.pow(1-k,3));e.textContent=fmt(v);if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
/* المظهر: داكن / فاتح / حسب الجوال */
function themeNow(){const t=db.settings.theme||'dark';return t==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t}
function applyTheme(){const t=themeNow();document.documentElement.dataset.theme=t;const c=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();try{A&&A.setBars&&A.setBars(c,t==='dark')}catch(e){}}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(db.settings.theme==='auto')applyTheme()})}catch(e){}
function applyZoom(){document.body.style.zoom=db.settings.zoom||1}
// ---------- التحديث عن بعد ----------
window.onUpdate=function(v,manual){const ap=A.appVersion();
  if(v.apk>ap){sheet(`<h2>📲 نسخة جديدة من التطبيق ${esc(v.apkVer||'')}</h2>${v.notes?`<div style="white-space:pre-line;font-size:14.5px;line-height:1.8;margin-bottom:12px">${esc(v.notes)}</div>`:''}<div style="font-size:13px;color:var(--mut);margin-bottom:12px">تتحمّل وتفتح لك شاشة التثبيت، وبياناتك تبقى مثل ما هي.</div><div class="btns"><button class="btn full" onclick="A.installApk('${v.apkSha}','${esc(v.apkFile||'Rentals.apk')}');closeSheet()">⬇️ تحميل وتثبيت</button></div>`);return}
  if(v.web>WEBV&&(v.minApk||0)<=ap){window._updNotes=v.notes||'';A.fetchWeb(v.webSha,v.web);return}
  if(manual)toast('عندك آخر نسخة ✓')};
window.onWebReady=function(){sheet(`<h2>✨ وصل تحديث جديد</h2>${window._updNotes?`<div style="white-space:pre-line;font-size:14.5px;line-height:1.8;margin-bottom:12px">${esc(window._updNotes)}</div>`:''}<div class="btns"><button class="btn full" onclick="A.reload()">🔄 حدّث الحين</button></div><div style="text-align:center;color:var(--mut);font-size:13px">أو يتحدّث لحاله المرة الجاية اللي تفتح فيها التطبيق</div>`)};
window.onUpdateFail=function(e){toast('تعذر التحقق من التحديث — تأكد من النت')};
function checkUpd(manual){if(A&&A.checkUpdate)A.checkUpdate(!!manual);else toast('التحديث يشتغل من التطبيق على الجوال')}
// المستندات المرفقة مع التطبيق (عقود البلدية) تنضاف مرة وحدة لأراضيها
function addBundled(){if(!A||!A.installBundled||!window.SEED||!SEED.DOCS||db.settings.bundled1)return;
  let ok=true;SEED.DOCS.forEach(it=>{const l=db.lands.find(x=>String(x.landNo).trim()===it.plot);if(!l){ok=false;return}l.docs=l.docs||[];
    if(l.docs.some(d=>d.kind===it.kind&&d.file&&d.file.endsWith(it.file)))return;const f=A.installBundled(it.file);if(!f){ok=false;return}
    l.docs.push({id:uid(),kind:it.kind,name:it.name,file:f,pdf:true,date:today()})});
  if(ok)db.settings.bundled1=1;save()}
load();addBundled();applyTheme();applyZoom();render();drainDocs();takeShared();setTimeout(()=>checkUpd(0),2500);
</script>
</body>
</html>
